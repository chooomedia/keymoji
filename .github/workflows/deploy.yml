name: Manual Deploy (Emergency)

# This workflow is for MANUAL emergency deploys only.
# Normal deployments run automatically via build.yml (build + deploy jobs).
# Use this only when you need to force-deploy without triggering a new build.

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to deploy'
                required: true
                default: 'main'
                type: choice
                options:
                    - main
                    - staging

concurrency:
    group: manual-deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        name: Manual Deploy to Production
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.branch }}

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Generate .env.production with secrets
              run: |
                  if [ -n "${{ secrets.WEBHOOK_BASE }}" ]; then
                    echo "VITE_N8N_URL=${{ secrets.WEBHOOK_BASE }}" > .env.production
                  fi
                  if [ -n "${{ secrets.WEBHOOK_TEST_BASE }}" ]; then
                    echo "WEBHOOK_TEST_BASE=${{ secrets.WEBHOOK_TEST_BASE }}" >> .env.production
                  fi
                  if [ -n "${{ secrets.WEBHOOK_APERTUS_TEST }}" ]; then
                    echo "VITE_WEBHOOK_APERTUS_TEST=${{ secrets.WEBHOOK_APERTUS_TEST }}" >> .env.production
                  fi
                  # SECURITY: Apertus token is now server-side only via Vercel proxy (/api/story).
                  echo "✅ Apertus token is handled server-side via Vercel — no client-side secret needed."

            - name: Build project
              run: npm run build

            - name: Create .htaccess file
              run: cp deploy/htaccess.conf build/.htaccess

            - name: Verify build
              run: |
                  if [ ! -f "build/index.html" ]; then
                    echo "❌ build/index.html not found!"
                    exit 1
                  fi
                  echo "✅ Ready to deploy"

            - name: 📂 Deploy via FTP (attempt 1)
              id: ftp_deploy_1
              continue-on-error: true
              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  password: ${{ secrets.PASSWORD }}
                  server-dir: ${{ secrets.SERVERDIR }}
                  local-dir: ./build/
                  exclude: |
                      **/.git*
                      **/.git*/**
                      **/node_modules/**
                  log-level: verbose
                  timeout: 300000
                  dangerous-clean-slate: false

            - name: ⏳ Wait before retry
              if: steps.ftp_deploy_1.outcome == 'failure'
              run: |
                  echo "⚠️ FTP attempt 1 failed, waiting 30s before retry..."
                  sleep 30

            - name: 📂 Deploy via FTP (attempt 2)
              if: steps.ftp_deploy_1.outcome == 'failure'
              id: ftp_deploy_2
              continue-on-error: true
              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  password: ${{ secrets.PASSWORD }}
                  server-dir: ${{ secrets.SERVERDIR }}
                  local-dir: ./build/
                  exclude: |
                      **/.git*
                      **/.git*/**
                      **/node_modules/**
                  log-level: verbose
                  timeout: 300000
                  dangerous-clean-slate: false

            - name: ⏳ Wait before final retry
              if: steps.ftp_deploy_1.outcome == 'failure' && steps.ftp_deploy_2.outcome == 'failure'
              run: |
                  echo "⚠️ FTP attempt 2 failed, waiting 60s before final retry..."
                  sleep 60

            - name: 📂 Deploy via FTP (attempt 3 - final)
              if: steps.ftp_deploy_1.outcome == 'failure' && steps.ftp_deploy_2.outcome == 'failure'
              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  password: ${{ secrets.PASSWORD }}
                  server-dir: ${{ secrets.SERVERDIR }}
                  local-dir: ./build/
                  exclude: |
                      **/.git*
                      **/.git*/**
                      **/node_modules/**
                  log-level: verbose
                  timeout: 300000
                  dangerous-clean-slate: false
